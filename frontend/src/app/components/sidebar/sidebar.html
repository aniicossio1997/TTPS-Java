  <aside class="sidebar">
    <div class="sidebar__header">
      <div class="sidebar__logo">
        <img src="/fotos/icono.png" alt="¿Dónde estás? Volvé a casa" width="60px" height="60px" />
        <div class="sidebar__logo-text">
          <span class="sidebar__logo-title">¿Dónde estás?</span>
          <span class="sidebar__logo-subtitle">volvé a casa…</span>
        </div>
      </div>
    </div>

    <nav class="sidebar__nav">
      <a routerLink="/" routerLinkActive="sidebar__nav-link--active" class="sidebar__nav-link"
        [routerLinkActiveOptions]="{ exact: true }">
        <i class="pi pi-home sidebar__nav-icon"></i>
        <span>Inicio</span>
      </a>

      <a routerLink="perfil" routerLinkActive="sidebar__nav-link--active" class="sidebar__nav-link">
        <i class="pi pi-user sidebar__nav-icon"></i>
        <span>Mi perfil</span>
      </a>
    </nav>

    <div class="sidebar__footer">
      <button pButton type="button" label="Salir" icon="pi pi-sign-out"
        class="p-button-text sidebar__logout-btn" (click)="salir()"></button>
    </div>
  </aside>
