<button
  type="button"
  (click)="open()"
  class="
    w-full mt-4
    flex items-center gap-3
    px-4 py-2
    border-3 border-emerald-400 rounded-lg
    text-emerald-600
    hover:bg-emerald-50
    transition
    cursor-pointer

    focus:outline-none focus:ring-2 focus:ring-emerald-300
  "
  aria-label="Clic para ver la ubicación"
>
<div class="flex justify-center w-full gap-2 align-middle">
    <!-- Icono grande REAL -->
  <i class="pi pi-map-marker " style="font-size: 1.6rem;" ></i>

  <div class="font-medium">
      {{textoLabel()}}
      @if(confirmed()){
            <div class="flex">
            <span class="font-light text-gray-500 ">(Toca aquí para buscar/cambiar la ubicación)</span>
            </div>
      }
  </div>
</div>
</button>









  <p-dialog
    [closable]="false"
    [visible]="dialogOpen()"
    (visibleChange)="dialogOpen.set($event)"
    header="Seleccionar ubicación"

    [modal]="true" [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }" [style]="{ width: '50vw' }" [draggable]="false" [resizable]="false"


  >
    <div class="map-wrapper">
      <div #mapContainer class="map"></div>

      <div class="info">
        @if (temp()) {
          <div>
            <b>Latitud:</b> {{ temp()!.lat }} &nbsp;
            <b>Longitud:</b> {{ temp()!.lng }}
          </div>
        }

        @if (loadingGeoref()) {
          <span class="muted">Buscando ubicación…</span>
        } @else if (georefText()) {
          <span>{{ georefText() }}</span>
        }@else {
          <span class="font-bold">{{textoLabel()}}</span>
        }

      </div>
    </div>

    <ng-template pTemplate="footer">
      <div class="flex justify-between w-full">
        <p-button [type]="'button'"   severity="secondary" label="Cancelar" (click)="cancel()"   />
        <button [type]="'button'" pButton label="Confirmar" (click)="confirmMap($event)" [disabled]="temp()==null"></button>
      </div>
    </ng-template>
  </p-dialog>
