    <p-drawer
      [visible]="drawerOpen()"
      position="left"
      styleClass="w-72"
      (onHide)="closeDrawer.emit()"
      [closable]="false"
    >
      <ng-template pTemplate="header">
        <div class="flex items-center gap-2">
          <img src="/fotos/icono.png" alt="¿Dónde estás? Volvé a casa" width="50px" height="50px" />
          <div class="flex flex-col items-center justify-center">
            <span class="text-[12px] text-[#36ac77] font-bold">¿Dónde estás?</span>
            <span class="text-[12px] text-[#36ac77]">volvé a casa…</span>
          </div>
        </div>
      </ng-template>

        <!-- 2. Navegación (Links) -->
        <nav class="flex-1  py-6 space-y-1 overflow-y-auto">
          @if (isAdmin()) {
            <div class="font-bold border-t border-gray-200 w-full">
              <span class="flex justify-center">Administrador</span>
            </div>
          }
          <a routerLink="publicaciones" routerLinkActive="bg-[#39B67D]"  [routerLinkActiveOptions]="{ exact: false }" class="flex items-center gap-3 px-4 py-3 text-[#39B67D] hover:bg-teal-50 hover:text-teal-700 rounded-lg transition-colors group">
            <!-- Icono Casa -->
            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 512 512"
                fill="currentColor"
                class="w-6 h-6 text-[#39B67D]"
                routerLinkActive="text-white"
            >
                <path d="M226.5 92.9c14.3 42.9-.3 86.2-32.6 96.8s-70.1-15.6-84.4-58.5s.3-86.2 32.6-96.8s70.1 15.6 84.4 58.5zM100.4 198.6c18.9 32.4 14.3 70.1-10.2 84.1s-59.7-.9-78.5-33.3S-2.7 179.3 21.8 165.3s59.7 .9 78.5 33.3zM69.2 401.2C121.6 259.9 214.7 224 256 224s134.4 35.9 186.8 177.2c3.6 9.7 5.2 20.1 5.2 30.5v1.6c0 25.8-20.9 46.7-46.7 46.7c-11.5 0-22.9-1.4-34-4.2l-88-22c-15.3-3.8-31.3-3.8-46.6 0l-88 22c-11.1 2.8-22.5 4.2-34 4.2C84.9 480 64 459.1 64 433.3v-1.6c0-10.4 1.6-20.8 5.2-30.5zM421.8 282.7c-24.5-14-29.1-51.7-10.2-84.1s54-47.3 78.5-33.3s29.1 51.7 10.2 84.1s-54 47.3-78.5 33.3zM310.1 189.7c-32.3-10.6-46.9-53.9-32.6-96.8s52.1-69.1 84.4-58.5s46.9 53.9 32.6 96.8s-52.1 69.1-84.4 58.5z"/>
            </svg>
            <span class="font-medium " routerLinkActive="text-white">Inicio</span>
          </a>

          <a  routerLink="perfil" routerLinkActive="bg-[#39B67D] text-white" class="flex items-center gap-3 px-4 py-3 text-[#39B67D] hover:bg-teal-50 hover:text-teal-700 rounded-lg transition-colors group">
             <!-- Icono Mascota -->
           <i class="pi pi-user  " routerLinkActive="text-white"></i>

            <span class="font-medium">Mi perfil</span>
          </a>

          <a  routerLink="mapa" routerLinkActive="bg-[#39B67D] text-white" class="flex items-center gap-3 px-4 py-3 text-[#39B67D] hover:bg-teal-50 hover:text-teal-700 rounded-lg transition-colors group">
             <!-- Icono Mascota -->
            <i class="pi pi-map-marker "></i>
            <span class="font-medium">Mapa</span>
          </a>

        </nav>

        <ng-template #footer>
            <div class="flex items-center gap-2">
      <button pButton type="button" label="Salir" icon="pi pi-sign-out"
        class="p-button-text sidebar__logout-btn" (click)="salir()"></button>
            </div>
        </ng-template>

    </p-drawer>
