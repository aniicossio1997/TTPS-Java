<div class="flex justify-center items-center mt-20">

    <div class="max-w-4xl w-full bg-white/90 backdrop-blur-sm rounded-3xl shadow-xl overflow-hidden border border-emerald-100 flex flex-col md:flex-row relative">

        <!-- Sección de Texto -->
        <!-- Ajuste responsive: p-6 en móvil, p-12 en escritorio para mejor espacio -->
        <div class="w-full md:w-1/2 p-6 md:p-12 flex flex-col justify-center text-center md:text-left order-2 md:order-1">
            <!-- Ajuste responsive: Texto más pequeño en móvil (6xl) y grande en escritorio (8xl) -->
            <h1 class="text-6xl md:text-8xl font-bold text-[#39b385] mb-2">404</h1>
            <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-4">Página no encontrada</h2>
            <p class="text-gray-600 mb-8 text-lg">
                Parece que la página que buscas no existe o se ha movido. Pero no te preocupes, puede volver al inicio.
            </p>

            <div class="flex flex-col sm:flex-row gap-4 justify-center md:justify-start">
                <!-- Botón Principal con el color exacto -->
                <a href="/" class="flex items-center justify-center gap-2 bg-[#39b385] hover:opacity-90 text-white font-semibold py-3 px-6 rounded-full transition-all transform hover:scale-105 shadow-md group">
                    <i data-lucide="home" class="w-5 h-5 group-hover:-translate-y-1 transition-transform"></i>
                    Volver al Inicio
                </a>
                <!-- Botón Secundario -->
                <button onclick="history.back()" class="flex items-center justify-center gap-2 bg-white hover:bg-emerald-50 text-[#39b385] border-2 border-[#39b385] font-semibold py-3 px-6 rounded-full transition-all">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    Regresar
                </button>
            </div>
        </div>

        <!-- Sección de Imagen (Aquí va tu foto) -->
        <!-- Ajuste responsive: order-1 en móvil (aparece primero), order-2 en escritorio -->
        <div class="w-full md:w-1/2 bg-[#39b385]/10 flex items-center justify-center p-6 order-1 md:order-2 relative group">
            <!-- Marco decorativo -->
            <div class="absolute inset-4 border-2 border-dashed border-[#39b385]/40 rounded-2xl pointer-events-none"></div>

            <!-- Contenedor de la imagen -->
            <div class="relative w-full max-w-sm aspect-square rounded-2xl overflow-hidden shadow-lg transform group-hover:rotate-1 transition-transform duration-500 bg-white">

                <!-- TU IMAGEN SE CARGA AQUÍ -->
                <img
                    src="/fotos/not_found.png"
                    alt="Página no encontrada - Amigos perdidos"
                    class="w-full h-full object-cover"
                    onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'w-full h-full flex flex-col items-center justify-center text-gray-400 bg-gray-50 p-4 text-center\'><i data-lucide=\'image\' class=\'w-12 h-12 mb-2 text-[#39b385]\'></i><span class=\'text-sm\'>Tu imagen (image_7f6f88.png) aparecerá aquí</span></div>'"
                >
            </div>
        </div>

    </div>
</div>
