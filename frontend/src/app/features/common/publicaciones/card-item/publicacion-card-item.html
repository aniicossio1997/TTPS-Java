<p-card
  class="shadow-md rounded-xl overflow-hidden hover:scale-[1.01] transition ease-out duration-200 cursor-pointer"
  (click)="navigateToDetail(publicacion.id)"
>
  <ng-template #header>
    <div class="w-full h-56 bg-gray-200 flex items-center justify-center relative">
      <img
        [src]="publicacion.fotos[0]?.url  || defaultImageUrl"
        [alt]="'Imagen de ' + publicacion.nombre"
        class="w-full h-full object-cover text-transparent"
        loading="lazy"
      />

      <span class="absolute bottom-2 left-2">
        <app-estado-publicacion-tag [estado]="publicacion.estado?.estado || ''" />
      </span>

      <p-button
        aria-label="Ver ubicación"
        class="absolute bottom-2 right-2 hover:scale-110 focus:scale-110 transition ease-out duration-200"
        styleClass="bg-red-500/50"
        [rounded]="true"
        (click)="$event.stopPropagation(); verUbicacion(publicacion.ubicacion)"
      >
        <span>Ver ubicación</span>
        <span class="pi pi-map-marker"></span>
      </p-button>
    </div>
  </ng-template>

  <div class="space-y-2">
    <h3 class="font-bold mb-0 line-clamp-2">
      {{ publicacion.nombre }}
    </h3>
    @if (publicacion.descripcion) {
    <p class="text-sm line-clamp-3">
      {{ publicacion.descripcion }}
    </p>
    }
    <p class="text-sm">
      <strong>Fecha:</strong>
      {{ publicacion.fecha | date : 'dd/MM/yyyy' }}
    </p>

    <p class="text-sm"><strong>Color:</strong> {{ publicacion.color }}</p>
    <p class="text-sm"><strong>Tamaño:</strong> {{ publicacion.tamanio }}</p>
  </div>
</p-card>
