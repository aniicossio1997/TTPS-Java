spring.application.name=ttps-spring-boot

# Conexión a la Base de Datos (reemplaza a tu bean 'dataSource')
spring.datasource.url=jdbc:mysql://localhost:3306/ttps_java_grupo20
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate (reemplaza a tu 'entityManagerFactory')
# Esto equivale a tu "hibernate.hbm2ddl.auto" = "update"
spring.jpa.hibernate.ddl-auto=update

# Esto equivale a "hibernate.show_sql" = "true"
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# (Opcional) Le dice a Spring que no mapee a /error por defecto
server.error.whitelabel.enabled=false

# Cambiamos el puerto para que no choque con el Tomcat externo
server.port = 8081

# JWT
jwt.secret=asdasd123asdasd123asdasd123asdasd123

spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB


server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.data.jpa.repository.query=DEBUG
